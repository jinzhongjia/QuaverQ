[project]
name = "quaverq"
version = "0.1.0"
description = "QuaverQ — QQ 音乐桌面客户端 (GTK 4 + Libadwaita)"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [{ name = "Jin", email = "jinzhongjia@qq.com" }]
keywords = ["qqmusic", "music", "player", "gtk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]

dependencies = [
    "qqmusic-api-python>=0.6.1,<0.7",
    "tomli-w>=1.0",
    "dbus-next>=0.2.3",   # MPRIS2 D-Bus 集成 (媒体键 / GNOME Now Playing)
    "PyGObject>=3.50",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
filterwarnings = [
    # PyGObject 内部加载 GLib proxy 时遍历到 deprecated alias 触发,
    # 不是我们代码直接调用 — 我们已经用 GLibUnix.signal_add_full.
    "ignore::DeprecationWarning:gi.overrides",
]

[project.urls]
repository = "https://github.com/jinzhongjia/quaverq"

[project.scripts]
quaverq = "quaverq.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quaverq"]

[tool.uv]
package = true

[tool.quaverq]
nuitka_module_mode = "standalone"
nuitka_opt_level = "2"
