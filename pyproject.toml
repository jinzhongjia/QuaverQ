[project]
name = "quaverq"
version = "0.1.0"
description = "QuaverQ — QQ 音乐桌面客户端 (PySide6 + Qt Quick, Linux 优先)"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [{ name = "Jin", email = "jinzhongjia@qq.com" }]
keywords = ["qqmusic", "music", "player", "qt", "pyside6", "qml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]

# 依赖见 docs/design.md §13. v1 Linux only; Windows / macOS 见 §1.3 deferred.
dependencies = [
    "qqmusic-api-python>=0.6.1,<0.7",
    "tomli-w>=1.0",
    "dbus-next>=0.2.3",     # MPRIS2 D-Bus 集成 (媒体键 / GNOME Now Playing)
    "PySide6>=6.6",          # Qt for Python (QML + QtMultimedia)
    "qasync>=0.27",          # asyncio ↔ Qt event loop 桥 (见 design §8.4)
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
[project.urls]
repository = "https://github.com/jinzhongjia/quaverq"

[project.scripts]
quaverq = "quaverq.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quaverq"]

[tool.uv]
package = true

[tool.quaverq]
nuitka_module_mode = "standalone"
nuitka_opt_level = "2"
