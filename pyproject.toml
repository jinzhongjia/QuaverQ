[project]
name = "quaverq"
version = "0.1.0"
description = "QuaverQ — QQ 音乐桌面客户端 (PySide6 + Qt Quick, Linux 优先)"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [{ name = "Jin", email = "jinzhongjia@qq.com" }]
keywords = ["qqmusic", "music", "player", "qt", "pyside6", "qml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]

# 跨平台依赖.
# Linux-only 项用 sys_platform marker 隔离, Windows / macOS 装包时自动跳过.
dependencies = [
    "qqmusic-api-python>=0.6.1,<0.7",
    "tomli-w>=1.0",
    "platformdirs>=4.0",     # 跨平台 config / cache 目录解析
    "keyring>=24.0",         # 跨平台凭据存储 (Linux Secret Service / Win Credential Manager / macOS Keychain)
    "PySide6>=6.6",          # Qt for Python (QML + QtMultimedia)
    "qasync>=0.27",          # asyncio ↔ Qt event loop 桥
    "curl-cffi>=0.15.0",
    "mutagen>=1.47",         # 下载产物的音频标签嵌入 (ID3v2 / FLAC / Vorbis); GPL-2+ 与本项目 GPL-3+ 兼容
    'dbus-next>=0.2.3 ; sys_platform == "linux"',  # MPRIS2 D-Bus, 仅 Linux
]

[dependency-groups]
dev = [
    "nuitka>=4.1.2",
    'patchelf>=0.17.2.4 ; sys_platform == "linux"',  # ELF rpath, Nuitka Linux 产物需要
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "dist", "build", ".pytest_cache"]

[tool.ruff.lint]
# 选规则: pyflakes(F) + pycodestyle(E/W) + isort(I) + bugbear(B) + pyupgrade(UP)
# + comprehensions(C4) + simplify(SIM) + return(RET) + 自然 Python(PIE) + 类型注解(ANN 仅公开 API)
select = [
    "F",   # pyflakes: 未用 import / 未定义名
    "E",   # pycodestyle 错误
    "W",   # pycodestyle 警告
    "I",   # isort: import 排序
    "B",   # bugbear: 常见陷阱
    "UP",  # pyupgrade: 升级到目标版本写法
    "C4",  # comprehensions: 推导式简化
    "SIM", # simplify: 等价简化
    "RET", # 返回语句风格
    "PIE", # 自然 Python 风格
]
ignore = [
    "E501",   # 行宽由 formatter 管, 不在 lint 报
    "SIM108", # 三元 if 不强制 (可读性优先)
    "B008",   # 函数默认值调用 (PySide6 Signal/Slot 装饰器场景常见)
    "RET504", # 允许显式 result 变量再 return (调试友好)
]

[tool.ruff.lint.per-file-ignores]
# 测试文件: 允许未用 fixture 参数 / magic value / 长 setup
"tests/**/*.py" = ["B011", "SIM117"]
# MPRIS D-Bus 服务端: dbus-next 通过 __annotations__ 读 D-Bus 签名,
# 注解必须是字符串字面量 (如 "b", "s", "o", "as", "a{sv}"), 这些不是 Python 类型,
# 会被 ruff 误报为未定义名 / 语法错误.
"src/quaverq/core/mpris.py" = ["F821", "F722", "UP037"]
"src/quaverq/core/lyric_dbus.py" = ["F821", "F722", "UP037"]

[tool.ruff.lint.isort]
known-first-party = ["quaverq"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
[project.urls]
repository = "https://github.com/jinzhongjia/quaverq"

[project.scripts]
quaverq = "quaverq.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quaverq"]

[tool.uv]
package = true

[tool.quaverq]
nuitka_module_mode = "standalone"
nuitka_opt_level = "2"
