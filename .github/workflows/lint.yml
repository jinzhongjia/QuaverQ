name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync project (incl. dev deps)
        run: uv sync --dev

      - name: Run unified lint (ruff + pyside6-qmllint)
        run: uv run python scripts/lint.py
