name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # linuxdeploy 自身是 AppImage；GitHub runner 无 FUSE，改用解压执行
  APPIMAGE_EXTRACT_AND_RUN: '1'

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            patchelf libfuse2 libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync project (incl. build deps)
        run: uv sync --dev

      - name: Fetch linuxdeploy + Qt plugin
        run: |
          base=https://github.com/linuxdeploy
          wget -q $base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          wget -q $base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O linuxdeploy-plugin-qt
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Build AppImage (Nuitka standalone + linuxdeploy)
        run: uv run python build.py --appimage

      - name: Smoke test bundle (QML 加载 + 窗口创建)
        run: uv run python -m quaverq.packaging --smoke dist/quaverq.dist/QuaverQ

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuaverQ-x86_64-AppImage
          path: '*.AppImage'
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.AppImage'
          generate_release_notes: true
