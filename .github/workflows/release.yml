name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # linuxdeploy 自身是 AppImage；GitHub runner 无 FUSE，改用解压执行
  APPIMAGE_EXTRACT_AND_RUN: '1'

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libpulse0 是 Qt6Multimedia 的运行时依赖（PulseAudio），
          # linuxdeploy 部署 libQt6Multimedia.so.6 时必须能解析到 libpulse.so.0
          sudo apt-get install -y \
            patchelf libfuse2 libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xkb1 libxcb-randr0 libxcb-render-util0 libxcb-image0 \
            libxcb-xinerama0 libxcb-sync1 libxcb-xfixes0 \
            libpulse0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync project (incl. build deps)
        run: uv sync --dev

      - name: Fetch linuxdeploy
        # 不需要 linuxdeploy-plugin-qt：Nuitka 的 pyside6 插件已把整套 Qt 打进 bundle，
        # qt 插件反而会去部署系统 Qt（引入 sqldrivers 等缺失依赖而失败）。
        run: |
          base=https://github.com/linuxdeploy
          wget -q $base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          chmod +x linuxdeploy
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Build AppImage (Nuitka standalone + linuxdeploy)
        run: uv run python build.py --appimage

      - name: Smoke test bundle (QML 加载 + 窗口创建)
        run: uv run python -m quaverq.packaging --smoke dist/quaverq_entry.dist/QuaverQ

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuaverQ-x86_64-AppImage
          path: 'dist/*.AppImage'
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: 'dist/*.AppImage'
          generate_release_notes: true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync project (incl. build deps)
        run: uv sync --dev

      - name: Install WiX 5 CLI + UI extension
        # dotnet tool install global -> wix.exe 进 PATH; UI 扩展默认不带, 显式加.
        run: |
          dotnet tool install --global wix
          wix extension add -g WixToolset.UI.wixext

      - name: Build MSI (Nuitka standalone + WiX 5)
        run: uv run python build.py --msi

      - name: Build portable ZIP (复用 MSI 已经跑过的 Nuitka 产物)
        # --no-rebuild 跳过 5 分钟链接 + 250MB 复制, 只走 zip 那段
        run: uv run python build.py --portable --no-rebuild

      - name: Smoke test bundle (QML 加载 + 窗口创建)
        # offscreen 平台启动, 不依赖 RDP / 显示器
        run: uv run python -m quaverq.packaging --smoke dist/quaverq_entry.dist/QuaverQ.exe

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuaverQ-x86_64-MSI
          path: 'dist/QuaverQ-*.msi'
          if-no-files-found: error

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuaverQ-x86_64-Portable
          path: 'dist/QuaverQ-*-portable.zip'
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/QuaverQ-*.msi
            dist/QuaverQ-*-portable.zip
          generate_release_notes: true
